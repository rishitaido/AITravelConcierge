<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Itinerary Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="layout-page">
  <section class="page-bg-itinerary">
    <header class="subheader">
      <a class="cta-secondary" href="{{ url_for('index') }}">← Back to Home</a>
    </header>

    <main class="layout-narrow fade-in">
      <h1>Trip Itinerary Viewer</h1>

      <section id="itinerary-builder" class="card">
        <h2>Build your itinerary</h2>
        <form id="itinerary-form">
          <label>City
            <input id="city" type="text" name="city" placeholder="e.g. Rome" required />
          </label>
          <label>Days
            <input id="days" type="number" name="days" min="1" max="14" value="3" required />
          </label>
          <label>Theme
            <select id="theme" name="theme">
              <option>Food & Culture</option>
              <option>Nature & Outdoors</option>
              <option>Museums & History</option>
              <option>Luxury & Relaxation</option>
            </select>
          </label>
          <label>Region Type
            <select id="region" name="region">
              <option>Beach / Coastal</option>
              <option>Snow / Mountains</option>
              <option>City / Urban</option>
              <option>Island / Remote</option>
              <option>Rainforest / Tropical</option>
            </select>
          </label>
          <label>Budget
            <select id="budget" name="budget">
              <option>Backpacker ($)</option>
              <option>Mid-range ($$)</option>
              <option>Luxury ($$$)</option>
            </select>
          </label>
          <label>Travel Pace
            <select id="pace" name="pace">
              <option>Relaxed</option>
              <option>Balanced</option>
              <option>Full / Packed</option>
            </select>
          </label>
          <label>Traveler Type
            <select id="traveler" name="traveler">
              <option>Solo</option>
              <option>Couple</option>
              <option>Family with kids</option>
              <option>Senior traveler</option>
              <option>Friend Group</option>
            </select>
          </label>

          <button id="build-btn" type="submit">Generate</button>
          <span id="build-spinner" hidden>⏳</span>
        </form>
      </section>

      <section id="viewer-output" class="card" style="padding: 1rem;">
      </section>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{{ url_for('globe') }}" class="btn-dark">View on Map</a>
      </div>
    </main>
  </section>

  <script src="{{ url_for('static', filename='toast.js') }}"></script>
  <script type="module">

  
  import { renderJSONItinerary, renderTextItinerary } from "{{ url_for('static', filename='itinerary-display.js') }}";

    document.getElementById("build-btn").addEventListener("click", async (e) => {
      e.preventDefault();

      const city      = document.getElementById("city").value.trim();
      const days      = parseInt(document.getElementById("days").value, 10);
      const theme     = document.getElementById("theme").value;
      const region    = document.getElementById("region").value;
      const budget    = document.getElementById("budget").value;
      const pace      = document.getElementById("pace").value;
      const traveler  = document.getElementById("traveler").value;

      if (!city || !days) {
        window.showToast && showToast("Please enter a city and number of days.", 'warning');
        return;
      }

      const payload = {
        prompt: { city, days, theme, region, budget, pace, traveler },
        days
      };

      document.getElementById("build-spinner").hidden = false;

      try {
        const res = await fetch("/api/itinerary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        // Prefer checking HTTP status and structured errors first
        const data = await res.json().catch(() => ({}));

        if (!res.ok || data.error) {
          const errMsg = data.error || `[HTTP ${res.status}] ${res.statusText}`;
          console.error("AI itinerary error:", errMsg);
          document.getElementById("viewer-output").innerHTML = `<pre class=\"message ai\" style=\"white-space:pre-wrap;padding:1rem;\">${errMsg}</pre>`;
          window.showToast && showToast(`AI Error: ${errMsg}`, 'error');
        } else {
        try {
          // If the reply is already an object, use it directly.
          let replyContent = data.reply;
          if (typeof replyContent === 'string') replyContent = replyContent.trim();

          // Helper: strip Markdown code fences (```json ... ``` or ``` ... ```)
          const stripCodeFences = (s) => {
            if (typeof s !== 'string') return s;
            // Remove leading ```json or ``` markers and trailing ```
            s = s.replace(/^```\s*json\s*/i, '');
            s = s.replace(/^```\s*/i, '');
            s = s.replace(/```\s*$/i, '');
            return s.trim();
          };

          if (typeof replyContent === 'string') replyContent = stripCodeFences(replyContent);

          let parsed;
          if (typeof replyContent === 'object') {
            parsed = replyContent;
          } else {
            parsed = JSON.parse(replyContent);
          }

          renderJSONItinerary(parsed);
          localStorage.setItem("itineraryJSON", JSON.stringify(parsed));
          localStorage.setItem("itineraryTimestamp", Date.now().toString());
        } catch (err) {
          // AI returned something that's not valid JSON. Handle gracefully:
          console.error("AI reply is not valid JSON:", err);

          const replyStr = String(data.reply || "");
          // If the backend returned an error marker, surface it to the user.
          if (replyStr.startsWith("[ERROR]")) {
            // show error message in place and surface toast
            document.getElementById("viewer-output").innerHTML = `<pre class="message ai" style="white-space:pre-wrap;padding:1rem;">${replyStr}</pre>`;
            window.showToast && showToast(`AI Error: ${replyStr}`, 'error');
          } else {
            // Treat the reply as plain text itinerary (some models may return text instead of JSON)
            renderTextItinerary(replyStr);
            localStorage.setItem("itineraryText", replyStr);
            localStorage.setItem("itineraryTimestamp", Date.now().toString());
          }
        }
      }
      } catch (err) {
  console.error("Failed to fetch itinerary:", err);
  window.showToast && showToast("Error contacting AI.", 'error');
      } finally {
        document.getElementById("build-spinner").hidden = true;
      }
    });
  </script>
</body>
</html>
