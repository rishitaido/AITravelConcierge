# Example: Create Kubernetes secrets for the application
# NOTE: Replace the placeholder values with your actual secrets

apiVersion: v1
kind: Secret
metadata:
  name: airports-ai-secrets
  namespace: default
type: Opaque
stringData:
  openrouter-api-key: "YOUR_OPENROUTER_API_KEY_HERE"
  maptiler-key: "YOUR_MAPTILER_KEY_HERE"
  grafana-password: "admin"
