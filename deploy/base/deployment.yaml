apiVersion: apps/v1
kind: Deployment
metadata:
  name: airports-ai
  labels:
    app: airports-ai
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airports-ai
  template:
    metadata:
      labels:
        app: airports-ai
        tier: backend
    spec:
      containers:
      - name: app
        image: airports-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: airports-ai-secrets
              key: openrouter-api-key
        - name: MAPTILER_KEY
          valueFrom:
            secretKeyRef:
              name: airports-ai-secrets
              key: maptiler-key
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airports-ai-secrets
              key: grafana-password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
