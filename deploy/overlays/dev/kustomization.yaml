apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - target:
      kind: Deployment
      name: airports-ai
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: airports-ai
      spec:
        template:
          spec:
            containers:
            - name: app
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

replicas:
  - name: airports-ai
    count: 1

images:
  - name: airports-ai
    newTag: latest
