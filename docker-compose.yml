# =============================================================
# docker-compose.yml — Local development stack
# =============================================================
#
# Starts the app + full observability (metrics, dashboards, logs).
#
# USAGE:
#   docker compose up -d        # start everything
#   docker compose logs -f      # stream all logs
#   docker compose down         # stop everything
#
# SERVICES:
#   python-app  → your Flask app             (port 8080)
#   prometheus  → scrapes /metrics           (port 9090)
#   grafana     → dashboards for prometheus  (port 3000)
#   loki        → log storage backend        (port 3100)
#   promtail    → ships logs to loki         (no exposed port)
#
# All services talk to each other over the "appnet" network.
# =============================================================

networks:
  appnet:
    driver: bridge

volumes:
  loki-data:
  promtail-data:


services:

  # ---- Your Flask app ----
  python-app:
    container_name: python-app
    build:
      context: . # uses the Dockerfile in this directory
    init: true
    restart: unless-stopped
    env_file:
      - .env # loads OPENROUTER_API_KEY, etc.
    ports:
      - "8080:8080"
    networks:
      - appnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # rotate logs at 10MB
        max-file: "3" # keep 3 rotated files

  # ---- Prometheus (metrics) ----
  # Scrapes the app's /metrics endpoint every 15s.
  # Config: config/prometheus.yml
  prometheus:
    image: prom/prometheus:latest
    platform: linux/amd64
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - appnet

  # ---- Grafana (dashboards) ----
  # Visualizes metrics from Prometheus and logs from Loki.
  # Login: admin / <GRAFANA_PASSWORD from .env>
  grafana:
    image: grafana/grafana:latest
    platform: linux/amd64
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - appnet

  # ---- Loki (log storage) ----
  # Receives logs from Promtail and stores them.
  # Config: config/loki.yaml
  loki:
    image: grafana/loki:2.8.2
    platform: linux/amd64
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - appnet

  # ---- Promtail (log shipper) ----
  # Tails log files and pushes them to Loki.
  # Config: config/promtail.yaml
  promtail:
    image: grafana/promtail:2.8.2
    platform: linux/amd64
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - promtail-data:/promtail
    depends_on:
      - loki
    networks:
      - appnet
